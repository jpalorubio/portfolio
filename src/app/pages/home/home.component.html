<!-- HERO -->
<section class="hero">
  <p class="hero-tag">{{ 'home.hero.tag' | translate }}</p>
  <h1 class="hero-name">{{ 'home.hero.title' | translate }}</h1>
  <p class="hero-title">{{ 'home.hero.subtitle' | translate }}</p>
  <p class="hero-desc">
    {{ 'home.hero.desc' | translate }}
  </p>
<div class="hero-btns">
  <button mat-raised-button class="hero-btn primary" routerLink="/projects">
    {{ 'home.hero.buttons.viewProjects' | translate }}
  </button>

  <button mat-stroked-button class="hero-btn primary" routerLink="/contact">
    {{ 'home.hero.buttons.contact' | translate }}
  </button>
</div>
</section>

<!-- SKILLS -->
<section class="section">
  <p class="section-label">{{ 'home.skills' | translate }}</p>
  <app-skill-list [skills]="skills()" />
</section>

<!-- PROYECTOS DESTACADOS -->
<section class="section projects-section">
  <p class="section-label">{{ 'home.featuredProjects' | translate }}</p>
  <div class="projects-grid">
  @for (project of projects(); track project.name) {
  <app-project-card [project]="project" />
}
  </div>
</section>
