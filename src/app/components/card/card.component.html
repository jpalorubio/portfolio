<mat-card>
  <mat-card-header>
    <p class="project-type">{{ project().type }}</p>
    <mat-card-title>{{ project().name }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p>{{ project().desc }}</p>
    <mat-chip-set>
      @for (tech of project().techs; track tech) {
        <mat-chip>{{ tech }}</mat-chip>
      }
    </mat-chip-set>
  </mat-card-content>

  <mat-card-actions>
    @if (project().urlDemo) {
      <a mat-button [href]="project().urlDemo" target="_blank">Demo</a>
    }
    @if (project().urlCode) {
      <a mat-button [href]="project().urlCode" target="_blank">Código</a>
    }
  </mat-card-actions>
</mat-card>
